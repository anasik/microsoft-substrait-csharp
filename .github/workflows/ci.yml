name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_PACKAGE_VERSION: 0.1.0-preview.${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Substrait.sln

      - name: Verify formatting
        run: dotnet format Substrait.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Substrait.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Substrait.sln --configuration Release --no-build --logger trx

      - name: Pack
        run: dotnet pack src/Substrait/Substrait.csproj --configuration Release --no-build --output artifacts/packages -p:PackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }}

      - name: Restore package smoke test
        run: dotnet restore tests/PackageSmokeTest/PackageSmokeTest.csproj -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} --source artifacts/packages --source https://api.nuget.org/v3/index.json --no-cache

      - name: Run package smoke test
        run: dotnet run --project tests/PackageSmokeTest/PackageSmokeTest.csproj --configuration Release --no-restore -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error